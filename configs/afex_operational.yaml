# ---------------------------------------------------------------------------
# AFEX multi-commodity farmgate panel, "operational" settings.
#
# Same model/training hyperparameters as configs/build2.yaml, applied to a
# structurally different dataset: no incumbent forecast file (grid is
# self-generated, see src/afex_data.py), no exogenous drivers (price only),
# 51 series across 7 commodities pooled for training, 16 maize series
# scored. See docs/DECISIONS.md for the entry documenting this workstream.
# ---------------------------------------------------------------------------
build:
  name: afex_operational
  note: >
    AFEX farmgate panel, price-only, same hyperparameters as build2's
    unconditional arm. All commodities train the pooled embedding; only
    maize series are scored.

data:
  panel: /Users/augmentumadvisory/Downloads/20260824_AFEX_MultiCommodity_Weekly_Panel_v1.xlsx

protocol:
  horizons: [4, 13, 26]

features:
  fourier_k: 2
  explicit_lag52: true

model:
  lookback: 52
  hidden: 64
  market_embedding_dim: 8
  head_dropout: 0.2
  input_dropout: 0.1

training:
  seeds: [0, 1, 2, 3, 4, 5, 6]
  epochs: 200
  batch_size: 256
  lr: 0.003
  patience: 25
  grad_clip: 1.0
  weight_decay: 0.0001
  lr_schedule: cosine
  huber_delta: 1.0
  val_fraction: 0.15
  purge_weeks: 78
  recency_half_life_weeks: 156
  scale_targets: true
  retrain_every_weeks: 13
  min_train_windows: 200
  seed_aggregation: median
