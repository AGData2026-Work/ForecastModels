# ---------------------------------------------------------------------------
# BUILD 2 -- the same two architectures given their best realistic chance
#
# Each change from Build 1 is numbered in docs/DECISIONS.md with a stated reason
# and a stated cost. Nothing here is a default chosen for tidiness.
# ---------------------------------------------------------------------------
build:
  name: build2_best_practice
  note: >
    Build 1 plus explicit per-horizon lag-52 anchors, per-horizon target
    scaling, a purged validation split, dropout and weight decay, recency
    weighting, a tighter retrain cadence, seven seeds aggregated by median, and
    Aba added as a sixteenth training series while still scoring fifteen.

data:
  panel: data/panel_weekly.parquet
  baseline_forecasts: data/07_panel_fe_forecasts.parquet
  train_markets: all_in_panel
  drop_target_dates: ["2019-04-24"]
  price_interp_limit_weeks: 13

protocol:
  horizons: [4, 13, 26]
  gate_horizons: [4, 13]
  gate_threshold_pct: 5.0

features:
  climate_scheme: inverse_distance
  fourier_k: 2
  explicit_lag52: true

model:
  lookback: 52
  hidden: 64
  market_embedding_dim: 8
  head_dropout: 0.2
  input_dropout: 0.1

training:
  seeds: [0, 1, 2, 3, 4, 5, 6]
  epochs: 200
  batch_size: 256
  lr: 0.003
  patience: 25
  grad_clip: 1.0
  weight_decay: 0.0001
  lr_schedule: cosine
  huber_delta: 1.0
  val_fraction: 0.15
  purge_weeks: 78
  recency_half_life_weeks: 156
  scale_targets: true
  retrain_every_weeks: 13
  min_train_windows: 200
  seed_aggregation: median
