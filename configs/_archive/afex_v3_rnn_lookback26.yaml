build:
  name: afex_v3_rnn_lookback26
  note: 'AFEX farmgate panel, price-only, same hyperparameters as build2''s unconditional
    arm. All commodities train the pooled embedding; only maize series are scored.

    '
data:
  panel: data/external/afex_multicommodity_panel.xlsx
protocol:
  horizons:
  - 4
  - 13
  - 26
features:
  fourier_k: 2
  explicit_lag52: true
model:
  lookback: 26
  hidden: 64
  market_embedding_dim: 8
  head_dropout: 0.2
  input_dropout: 0.1
training:
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  epochs: 200
  batch_size: 256
  lr: 0.003
  patience: 25
  grad_clip: 1.0
  weight_decay: 0.0001
  lr_schedule: cosine
  huber_delta: 1.0
  val_fraction: 0.15
  purge_weeks: 78
  recency_half_life_weeks: 156
  scale_targets: true
  retrain_every_weeks: 13
  min_train_windows: 200
  seed_aggregation: median
