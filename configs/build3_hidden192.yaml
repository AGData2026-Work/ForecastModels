# ---------------------------------------------------------------------------
# BUILD 3, hidden=192 -- bracketing build3's capacity choice from the other side
#
# If under-learning was the real diagnosis, capacity beyond 128 might still
# be helping. If 128 already overshot the useful range, this should show it
# levelling off or reversing.
# ---------------------------------------------------------------------------
build:
  name: build3_hidden192
  note: >
    Build 3 (safeguards removed) with hidden=192 instead of 128, to check
    whether the under-learning diagnosis still has room past build3's
    capacity choice. Nothing else differs from build3.yaml.

data:
  panel: data/panel_weekly.parquet
  baseline_forecasts: data/07_panel_fe_forecasts.parquet
  train_markets: all_in_panel
  drop_target_dates: ["2019-04-24"]
  price_interp_limit_weeks: 13

protocol:
  horizons: [4, 13, 26]
  gate_horizons: [4, 13]
  gate_threshold_pct: 5.0

features:
  climate_scheme: inverse_distance
  fourier_k: 2
  explicit_lag52: true

model:
  lookback: 52
  hidden: 192                      # build3 was 128, build2 was 64
  market_embedding_dim: 8
  head_dropout: 0.0
  input_dropout: 0.0

training:
  seeds: [0, 1, 2, 3, 4, 5, 6]
  epochs: 200
  batch_size: 256
  lr: 0.003
  patience: 25
  grad_clip: 1.0
  weight_decay: 0.0
  lr_schedule: cosine
  huber_delta: 1.0
  val_fraction: 0.15
  purge_weeks: 26
  recency_half_life_weeks: null
  scale_targets: true
  retrain_every_weeks: 13
  min_train_windows: 200
  seed_aggregation: median
