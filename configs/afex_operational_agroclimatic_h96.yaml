# ---------------------------------------------------------------------------
# Recreation of the deleted afex_operational_agroclimatic.yaml (removed by
# D-39; original content recovered from git history at commit db693bb~1),
# at hidden=96 instead of its original 64, to match the CURRENT full-exog
# production hidden size (D-43/D-44/D-45). Rainfall + NDVI only, no
# upstream-lag channel -- otherwise identical to
# afex_operational_full_exog.yaml.
#
# Purpose: isolate what the upstream-lag channel (a same-commodity, lagged
# neighbouring-market price) contributes on top of agroclimatic alone, with
# a full seven-seed paired comparison this time (D-38's original agroclimatic
# vs full-exog comparison was single-seed-median only, and the raw per-seed
# output no longer exists to check it after D-39's cleanup).
# ---------------------------------------------------------------------------
build:
  name: afex_operational_agroclimatic_h96
  note: >
    Recreated agroclimatic-only build (rainfall + NDVI, D-33), at hidden=96
    to match the current full-exog production hidden size, for a seeded
    ablation of the upstream-lag channel's real contribution (D-38's
    circularity/ablation question, never seed-checked).

data:
  panel: data/external/afex_multicommodity_panel.xlsx
  ndvi_path: data/external/ndvi_cleaned.xlsx
  rainfall_path: data/external/rainfall_cleaned.xlsx
  climate_state_map_path: data/external/ndvi_state_map.xlsx

protocol:
  horizons: [4, 13, 26]

features:
  fourier_k: 2
  explicit_lag52: true

model:
  lookback: 52
  hidden: 96                       # matched to current full-exog default, was 64 originally
  market_embedding_dim: 8
  head_dropout: 0.2
  input_dropout: 0.1

training:
  seeds: [0, 1, 2, 3, 4, 5, 6]
  epochs: 200
  batch_size: 256
  lr: 0.003
  patience: 25
  grad_clip: 1.0
  weight_decay: 0.0001
  lr_schedule: cosine
  huber_delta: 1.0
  val_fraction: 0.15
  purge_weeks: 78
  recency_half_life_weeks: 156
  scale_targets: true
  retrain_every_weeks: 13
  min_train_windows: 200
  seed_aggregation: median
