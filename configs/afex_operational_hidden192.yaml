# ---------------------------------------------------------------------------
# AFEX operational (no exog), hidden=192 -- same width-capacity bracket run
# as D-29/D-30 on the FEWSNET side and D-43/D-44 on AFEX full-exog, applied
# here to RNN operational, which has never been through a capacity bracket
# of its own (D-39 kept it as a finalist on direction, not accuracy, and no
# width check followed). Nothing else differs from afex_operational.yaml.
# ---------------------------------------------------------------------------
build:
  name: afex_operational_hidden192
  note: >
    AFEX operational (price-only, RNN direction pick) with hidden=192
    instead of 64, bracketing the current default the same way D-43/D-44
    bracketed the full-exog GRU build.

data:
  panel: data/external/afex_multicommodity_panel.xlsx

protocol:
  horizons: [4, 13, 26]

features:
  fourier_k: 2
  explicit_lag52: true

model:
  lookback: 52
  hidden: 192                      # was 64
  market_embedding_dim: 8
  head_dropout: 0.2
  input_dropout: 0.1

training:
  seeds: [0, 1, 2, 3, 4, 5, 6]
  epochs: 200
  batch_size: 256
  lr: 0.003
  patience: 25
  grad_clip: 1.0
  weight_decay: 0.0001
  lr_schedule: cosine
  huber_delta: 1.0
  val_fraction: 0.15
  purge_weeks: 78
  recency_half_life_weeks: 156
  scale_targets: true
  retrain_every_weeks: 13
  min_train_windows: 200
  seed_aggregation: median
