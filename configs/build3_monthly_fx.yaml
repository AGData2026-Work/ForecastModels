# STATUS: ONGOING EXPERIMENT, NOT PRODUCTION (D-64 to D-66, pinned). See docs/MODEL_STATUS.md.
# ---------------------------------------------------------------------------
# BUILD 3 -- remove the safeguards aimed at the wrong problem
#
# Copied from build2.yaml. Six changes only, all justified by the same
# premise (see docs/DECISIONS.md D-23): the Week 0 diagnostics indicate
# under-learning, not overfitting, so build 2's four overfitting safeguards
# are removed and capacity is raised. Nothing else differs from build2.yaml.
#
# lookback=26 (D-49, was 52). Owner decision, 2026-09-23: a seed-paired
# bracket found GRU significantly better at h=26 (t=2.88) with no
# significant effect at h=4/h=13; RNN showed no significant effect at any
# horizon, but every one of its point estimates also favoured 26 over 52,
# never against. Applied to both architectures, not GRU alone, to preserve
# the "same everything but the recurrent cell" parity this project's design
# depends on (D-38) -- confirmed safe for RNN, not just untested for it.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# BUILD 3 MONTHLY (monthly-cadence experiment, docs/MONTHLY_PROTOCOL.md)
#
# configs/build3.yaml translated from weeks to months and nothing else, per the
# owner's instruction that cadence be the only difference. With
# data.frequency: MS every *_weeks setting below counts MONTHS (steps of the
# panel), and horizons are 1 / 3 / 6 months. FX is not used (same as build3).
# ---------------------------------------------------------------------------
# FX VARIANT: build3_monthly.yaml plus two national sequence channels, official FX
# rate (log-ratio to the origin) and headline inflation YoY. Month-end lags: FX of
# the origin month itself (lag 0), inflation of the month before (lag 1). The only
# change from build3_monthly.yaml.
build:
  name: build3_monthly_fx
  note: >
    Build 2 with the regularisation added against overfitting removed, since the
    Week 0 diagnostics indicate under-learning was the binding constraint. Retains
    the lag-52 anchors, per-horizon target scaling, seed count and refit cadence.
    Raises capacity.

data:
  panel: data/panel_monthly.parquet          # src/build_monthly_panel.py
  baseline_forecasts: data/monthly_grid.parquet
  frequency: MS                              # month-start steps
  fx_rate_path: data/external/fx_rate.xlsx
  inflation_path: data/external/inflation.xlsx
  fx_lag_months: 0
  inflation_lag_months: 1
  train_markets: all_in_panel
  drop_target_dates: []           # the weekly outage-week drop has no monthly analogue
  price_interp_limit_weeks: 3     # months (13 weeks)

protocol:
  horizons: [1, 3, 6]             # months (4 / 13 / 26 weeks)
  gate_horizons: [1, 3]
  gate_threshold_pct: 5.0

features:
  climate_scheme: inverse_distance
  fourier_k: 2
  explicit_lag52: true
  use_macro: true

model:
  lookback: 6                      # months (26 weeks)
  hidden: 128                      # was 64
  market_embedding_dim: 8
  head_dropout: 0.0                # was 0.2
  input_dropout: 0.0               # was 0.1

training:
  seeds: [0, 1, 2, 3, 4, 5, 6]
  epochs: 200
  batch_size: 256
  lr: 0.003
  patience: 25
  grad_clip: 1.0
  weight_decay: 0.0                # was 0.0001
  lr_schedule: cosine
  huber_delta: 1.0
  val_fraction: 0.15
  purge_weeks: 6                   # months (26 weeks); falls back 3 -> 0
  recency_half_life_weeks: null    # was 156
  scale_targets: true
  retrain_every_weeks: 3          # months (13 weeks)
  min_train_windows: 46            # 200 x 12/52: the weekly floor never binds in the flagship (first cut
                                   # has 310); a literal 200 here would skip the first two monthly cuts
  seed_aggregation: median
