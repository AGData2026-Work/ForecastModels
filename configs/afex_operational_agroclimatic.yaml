# ---------------------------------------------------------------------------
# AFEX multi-commodity farmgate panel, "operational" settings, rainfall and
# NDVI as origin-time exogenous channels. Sibling-commodity crosscheck
# (sorghum, D-32) dropped for this build -- one change at a time, per the
# owner's instruction, since D-32 was a clean negative and mixing it in here
# would confound whatever this build finds.
#
# Sources: UN Data Exchange dekadal rainfall/NDVI, state-level, resolved via
# the geography-blocker fix in DECISIONS D-33. Real coverage: Gombe, Kaduna,
# Kano, Katsina, Plateau, Taraba -- the six states the AFEX maize markets
# sit in -- so every scored maize market gets a real channel, not a partial
# one (unlike the sorghum build, which only reached 7 of 15).
# ---------------------------------------------------------------------------
build:
  name: afex_operational_agroclimatic
  note: >
    AFEX farmgate panel, operational hyperparameters (as build2's
    unconditional arm), with state-level rainfall and NDVI (UN Data
    Exchange, dekadal, resampled to weekly) added as origin-time exogenous
    channels for every maize market's own state.

data:
  panel: /Users/augmentumadvisory/Downloads/20260824_AFEX_MultiCommodity_Weekly_Panel_v1.xlsx
  ndvi_path: /Users/augmentumadvisory/Downloads/UN_DataExchange_NDVI_cleaned.xlsx
  rainfall_path: /Users/augmentumadvisory/Downloads/UN_DataExchange_Rainfall_cleaned.xlsx
  climate_state_map_path: /Users/augmentumadvisory/Downloads/20260806_NDVI with States_v0.xlsx

protocol:
  horizons: [4, 13, 26]

features:
  fourier_k: 2
  explicit_lag52: true

model:
  lookback: 52
  hidden: 64
  market_embedding_dim: 8
  head_dropout: 0.2
  input_dropout: 0.1

training:
  seeds: [0, 1, 2, 3, 4, 5, 6]
  epochs: 200
  batch_size: 256
  lr: 0.003
  patience: 25
  grad_clip: 1.0
  weight_decay: 0.0001
  lr_schedule: cosine
  huber_delta: 1.0
  val_fraction: 0.15
  purge_weeks: 78
  recency_half_life_weeks: 156
  scale_targets: true
  retrain_every_weeks: 13
  min_train_windows: 200
  seed_aggregation: median
