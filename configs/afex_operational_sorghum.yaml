# ---------------------------------------------------------------------------
# AFEX multi-commodity farmgate panel, "operational" settings, sorghum as an
# exogenous sibling-commodity driver.
#
# Identical to configs/afex_operational.yaml except for data.sibling_commodity.
# Sorghum chosen by correlation screening (DECISIONS D-31): pooled
# correlation with maize is 0.86 at 13-week changes, far ahead of soybean
# (0.45, the next best) and every other commodity in this panel, and it
# pairs with 7 of the 15 scored maize markets (Dandume, dropped from
# scoring, would have made 8 of 16 before that drop). Populated as origin-time-only
# history (the model's existing "upstream" channel), never the forecast
# window, so this is deployable information, not foreknowledge.
# ---------------------------------------------------------------------------
build:
  name: afex_operational_sorghum
  note: >
    AFEX farmgate panel, operational hyperparameters (as build2's
    unconditional arm), with sorghum's own price history at the same
    market added as an origin-time exogenous channel for the 8 of 16
    maize markets that have a paired sorghum series.

data:
  panel: /Users/augmentumadvisory/Downloads/20260824_AFEX_MultiCommodity_Weekly_Panel_v1.xlsx
  sibling_commodity: Sorghum

protocol:
  horizons: [4, 13, 26]

features:
  fourier_k: 2
  explicit_lag52: true

model:
  lookback: 52
  hidden: 64
  market_embedding_dim: 8
  head_dropout: 0.2
  input_dropout: 0.1

training:
  seeds: [0, 1, 2, 3, 4, 5, 6]
  epochs: 200
  batch_size: 256
  lr: 0.003
  patience: 25
  grad_clip: 1.0
  weight_decay: 0.0001
  lr_schedule: cosine
  huber_delta: 1.0
  val_fraction: 0.15
  purge_weeks: 78
  recency_half_life_weeks: 156
  scale_targets: true
  retrain_every_weeks: 13
  min_train_windows: 200
  seed_aggregation: median
