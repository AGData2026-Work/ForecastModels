# ---------------------------------------------------------------------------
# AFEX full-exog, hidden=192 -- same width-capacity bracket run as D-29/D-30
# on the FEWSNET side, applied here for direct comparability. Nothing else
# differs from afex_operational_full_exog.yaml.
# ---------------------------------------------------------------------------
build:
  name: afex_operational_full_exog_hidden192
  note: >
    Full-exog (rainfall, NDVI, upstream lag) with hidden=192 instead of 64,
    bracketing the current default the same way D-29/D-30 bracketed
    build3's hidden=128 on the FEWSNET side.

data:
  panel: /Users/augmentumadvisory/Downloads/20260824_AFEX_MultiCommodity_Weekly_Panel_v1.xlsx
  ndvi_path: /Users/augmentumadvisory/Downloads/UN_DataExchange_NDVI_cleaned.xlsx
  rainfall_path: /Users/augmentumadvisory/Downloads/UN_DataExchange_Rainfall_cleaned.xlsx
  climate_state_map_path: /Users/augmentumadvisory/Downloads/20260806_NDVI with States_v0.xlsx
  upstream_lag_map:
    Saminaka: [Jengre, 1]
    Kumo: [Leggal, 1]
    Pambegua: [Anchau, 1]
    Bali: [Ikara, 1]
    Garbabi: [Gazabu, 1]
    Tundun Saibu: [Anchau, 1]
    Dawanau: [Tundun Saibu, 1]
    Jalingo: [Leggal, 1]
    Danja: [Ikara, 1]
    Leggal: [Jengre, 1]
    Jengre: [Giwa, 1]
    Giwa: [Leggal, 1]
    Ikara: [Bali, 2]
    Gazabu: [Ikara, 1]

protocol:
  horizons: [4, 13, 26]

features:
  fourier_k: 2
  explicit_lag52: true

model:
  lookback: 52
  hidden: 192                      # was 64
  market_embedding_dim: 8
  head_dropout: 0.2
  input_dropout: 0.1

training:
  seeds: [0, 1, 2, 3, 4, 5, 6]
  epochs: 200
  batch_size: 256
  lr: 0.003
  patience: 25
  grad_clip: 1.0
  weight_decay: 0.0001
  lr_schedule: cosine
  huber_delta: 1.0
  val_fraction: 0.15
  purge_weeks: 78
  recency_half_life_weeks: 156
  scale_targets: true
  retrain_every_weeks: 13
  min_train_windows: 200
  seed_aggregation: median
